  font-display: swap;
}

/* ==========================================================================
   Design tokens. Light is the default; dark is selected, not inverted.
   Quintile colors are a single teal ramp (ordinal data), validated for
   monotone lightness and contrast against each surface.
   ========================================================================== */
:root {
  color-scheme: light;
  --paper: #f2f4f7;
  --surface: #ffffff;
  --ink: #142233;
  --ink-2: #46556a;
  --muted: #66748a;
  --hair: #e2e7ee;
  --hair-strong: #cdd5df;
  --axis: #b9c3cf;
  --neutral: #d2dae4;
  --neutral-ink: #142233;
  --hl: #d99a00;
  --tip-bg: #142233;
  --tip-ink: #f2f4f7;
  --q1: #5fb5af; --q2: #3a9c9a; --q3: #21807f; --q4: #166468; --q5: #0d4850;
  --q1-on: #0e2a2e; --q2-on: #ffffff; --q3-on: #ffffff; --q4-on: #ffffff; --q5-on: #ffffff;
  --met: #166468;
  --met-on: #ffffff;
  --band-opacity: 0.11;
  --shadow: 0 1px 2px rgba(20, 34, 51, 0.05), 0 12px 32px rgba(20, 34, 51, 0.07);
  --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
  --move: 900ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0d131b;
    --surface: #151d27;
    --ink: #e8edf3;
    --ink-2: #b4c0cd;
    --muted: #8c99a9;
    --hair: #243040;
    --hair-strong: #33414f;
    --axis: #3e4c5c;
    --neutral: #3a4757;
    --neutral-ink: #e8edf3;
    --hl: #f2b53a;
    --tip-bg: #e8edf3;
    --tip-ink: #0d131b;
    --q1: #237373; --q2: #2d8d8b; --q3: #43a8a3; --q4: #6cc3bc; --q5: #9edcd4;
    --q1-on: #ffffff; --q2-on: #ffffff; --q3-on: #0d131b; --q4-on: #0d131b; --q5-on: #0d131b;
    --met: #6cc3bc;
    --met-on: #0d131b;
    --band-opacity: 0.16;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0d131b;
  --surface: #151d27;
  --ink: #e8edf3;
  --ink-2: #b4c0cd;
  --muted: #8c99a9;
  --hair: #243040;
  --hair-strong: #33414f;
  --axis: #3e4c5c;
  --neutral: #3a4757;
  --neutral-ink: #e8edf3;
  --hl: #f2b53a;
  --tip-bg: #e8edf3;
  --tip-ink: #0d131b;
  --q1: #237373; --q2: #2d8d8b; --q3: #43a8a3; --q4: #6cc3bc; --q5: #9edcd4;
  --q1-on: #ffffff; --q2-on: #ffffff; --q3-on: #0d131b; --q4-on: #0d131b; --q5-on: #0d131b;
  --met: #6cc3bc;
  --met-on: #0d131b;
  --band-opacity: 0.16;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; border-radius: 6px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ==========================================================================
   App shell
   ========================================================================== */
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-height: 100dvh;
  height: 100dvh;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 16px 32px 12px;
}
.brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
.brand-mark { width: 34px; height: 22px; flex: none; }
.brand-sub { font-weight: 400; color: var(--muted); }
.top-actions { display: flex; gap: 8px; }

.layout {
  display: grid;
  grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
  gap: 32px;
  padding: 4px 32px 0;
  min-height: 0;
}

/* --- Narrative column --------------------------------------------------- */
.narrative { display: flex; flex-direction: column; min-height: 0; padding: 20px 0 8px; overflow-y: auto; }
.step-count { margin: 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step-title {
  margin: 10px 0 18px;
  font-size: clamp(27px, 2.5vw, 36px);
  line-height: 1.12;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;
  outline: none;
}
.step-body p { margin: 0 0 14px; font-size: 17px; line-height: 1.62; color: var(--ink-2); max-width: 40ch; }
.step-body p.note { font-size: 14.5px; color: var(--muted); }
.step-body strong { color: var(--ink); font-weight: 600; }

.controls { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 24px; }
.kbd-hint { margin-left: 6px; font-size: 13px; color: var(--muted); }
kbd {
  font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 5px;
  border: 1px solid var(--hair-strong); background: var(--surface); color: var(--ink-2);
}

/* --- Buttons ------------------------------------------------------------ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px;
  font-size: 15px; font-weight: 500; line-height: 1;
  border-radius: 12px; border: 1px solid var(--hair-strong);
  background: var(--surface); color: var(--ink); cursor: pointer;
  transition: background 150ms, border-color 150ms, transform 150ms;
}
.btn:hover { border-color: var(--axis); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.btn-primary { background: var(--ink); border-color: var(--ink); color: var(--paper); min-width: 112px; }
.btn-primary:hover { background: var(--ink); border-color: var(--ink); filter: brightness(1.15); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); min-height: 38px; padding: 8px 12px; font-size: 14px; }
.btn-ghost:hover { background: var(--surface); border-color: var(--hair); color: var(--ink); }
.btn-small { min-height: 34px; padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }

/* --- Stage -------------------------------------------------------------- */
.stage-wrap {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--hair);
  border-radius: 20px;
  box-shadow: var(--shadow);
  min-height: 460px;
  overflow: hidden;
}
.stage-head {
  position: absolute; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 18px 22px 0; pointer-events: none;
}
.stage-title { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--ink); }
.stage-sub { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 14px; height: 14px; }
.stage-hint { font-size: 13px; color: var(--muted); }

svg.stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 400ms; }
svg.stage.is-faded { opacity: 0.1; }
svg.stage text { font-family: inherit; }

/* Dots: one <g> per student, moved with CSS transforms so every layout change animates. */
.dot { transform-box: view-box; transform-origin: 0 0; transition: transform var(--move) var(--ease), opacity 450ms; cursor: default; }
.dot .hit { fill: transparent; }
.dot .body { fill: var(--neutral); stroke: var(--surface); stroke-width: 2; vector-effect: non-scaling-stroke; transition: fill 500ms, stroke 500ms; }
.dot.is-colored .body { fill: var(--qc); }
.dot.is-hollow .body { fill: var(--surface); stroke: var(--qc); stroke-width: 2.5; }
.dot .ring { fill: none; stroke: var(--hl); stroke-width: 3; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity 300ms; }
.dot.is-hl .ring { opacity: 1; }
.dot.is-dim { opacity: 0.14; }
.dot .num {
  fill: var(--neutral-ink); font-size: 12.5px; font-weight: 500; text-anchor: middle; dominant-baseline: central;
  font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 300ms; pointer-events: none;
}
.show-nums .dot .num { opacity: 1; transition-delay: 350ms; }
.dot.is-colored .num { fill: var(--qon); }
.dot .glyph { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; vector-effect: non-scaling-stroke; opacity: 0; transition: opacity 300ms; pointer-events: none; }
.dot.is-met .check { opacity: 1; stroke: var(--qon); }
.dot.is-hollow .xmark { opacity: 1; stroke: var(--ink-2); }

.layer { transition: opacity 400ms; }
.layer.is-out { opacity: 0; }
.band { fill-opacity: var(--band-opacity); }
.axis-line { stroke: var(--axis); stroke-width: 1; }
.grid-line { stroke: var(--hair); stroke-width: 1; }
.tick { font-size: 12px; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
.row-sep { stroke: var(--hair); stroke-width: 1; }
.row-label { font-size: 13.5px; font-weight: 600; fill: var(--ink); }
.row-range { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.target-line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.target-label { font-size: 12.5px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.met-count { font-size: 12.5px; fill: var(--ink-2); text-anchor: end; font-variant-numeric: tabular-nums; }
.target-line, .target-label, .met-count { animation: fade-in 600ms var(--ease) both; }
@keyframes fade-in { from { opacity: 0; } }
.callout-box { fill: var(--surface); stroke: var(--hl); stroke-width: 1.5; }
.callout-lead { stroke: var(--hl); stroke-width: 1.5; }
.callout-title { font-size: 13px; font-weight: 600; fill: var(--ink); }
.callout-detail { font-size: 12.5px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }

.no-anim .dot, .no-anim .dot *, .no-anim .layer { transition: none !important; }

/* --- Tooltip ------------------------------------------------------------ */
.tooltip {
  position: absolute; z-index: 5; pointer-events: none;
  min-width: 170px; max-width: 240px; padding: 10px 12px;
  background: var(--tip-bg); color: var(--tip-ink);
  border-radius: 12px; font-size: 13px; line-height: 1.45;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}
.tooltip strong { display: block; font-size: 14px; font-weight: 600; }
.tooltip .tip-teacher { opacity: 0.75; margin-bottom: 6px; }
.tooltip dl { display: grid; grid-template-columns: auto auto; gap: 1px 14px; margin: 0; }
.tooltip dt { opacity: 0.75; }
.tooltip dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

/* --- Overlays (teacher score, summary) --------------------------------- */
.overlay {
  position: absolute; inset: 0; z-index: 3; overflow-y: auto;
  padding: 28px 32px; opacity: 0; transition: opacity 400ms; background: var(--surface);
}
.overlay.is-on { opacity: 1; }
.overlay:not(.is-on) { pointer-events: none; }
.ov { max-width: 720px; margin: 0 auto; }
.ov-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.ov-sub { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }
.ov-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.result { text-align: right; }
.result-figure { margin: 0; font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; }
.result-label { margin: 6px 0 0; font-size: 14.5px; color: var(--ink-2); }
.strip { display: flex; gap: 28px; flex-wrap: wrap; margin: 18px 0 4px; }
.strip-group { display: grid; gap: 8px; }
.cells { display: flex; gap: 5px; }
.cell { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--met); background: transparent; }
.cell.is-met { background: var(--met); }
.strip-label { font-size: 13px; color: var(--ink-2); }
.equation { margin: 12px 0 14px; font-size: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.equation strong { color: var(--ink); font-weight: 600; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px;
  border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap;
}
.chip svg { width: 14px; height: 14px; }
.overlay { container-type: inline-size; }
.rec-list {
  list-style: none; margin: 0; padding: 0; display: grid; column-gap: 32px;
  grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(var(--rows), auto); grid-auto-flow: column;
}
.rec-list li {
  display: grid; grid-template-columns: 88px auto minmax(0, 1fr); align-items: center; gap: 10px;
  padding: 6px 0; border-top: 1px solid var(--hair); font-size: 14px;
  opacity: 0; transform: translateY(4px); transition: opacity 350ms, transform 350ms var(--ease);
}
.rec-list li > .chip { justify-self: start; }
.overlay.is-on .rec-list li { opacity: 1; transform: none; }
.rec-name { font-weight: 600; }
.rec-detail { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
/* The list follows the width of the stage, not the window: one column when the stage is narrow. */
@container (max-width: 700px) {
  .rec-list { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-auto-flow: row; }
}
.chip.is-met { background: var(--met); color: var(--met-on); }
.chip.is-not { box-shadow: inset 0 0 0 1.5px var(--hair-strong); color: var(--ink-2); }

.rules { list-style: none; margin: 22px 0 26px; padding: 0; display: grid; gap: 4px; }
.rules li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--hair); }
.rules li:first-child { border-top: 0; }
.rule-n {
  width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center;
  background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14px;
}
.rule-head { margin: 0; font-weight: 600; font-size: 16px; }
.rule-text { margin: 2px 0 0; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
.ov-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* --- Progress ----------------------------------------------------------- */
.progress { padding: 18px 32px 18px; }
.progress-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--steps), minmax(0, 1fr)); gap: 6px; }
.seg { display: block; width: 100%; padding: 10px 0; background: none; border: 0; cursor: pointer; border-radius: 4px; }
.seg::before { content: ""; display: block; height: 5px; border-radius: 3px; background: var(--hair-strong); transition: background 300ms; }
.seg:hover::before { background: var(--axis); }
.seg.is-done::before { background: var(--ink-2); }
.seg.is-current::before { background: var(--ink); }
.progress-groups { display: grid; grid-template-columns: repeat(var(--steps), minmax(0, 1fr)); gap: 6px; margin-top: 2px; }
.pg { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg.is-current { color: var(--ink); font-weight: 500; }
.disclaimer { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

/* --- Data dialog -------------------------------------------------------- */
dialog.data {
  width: min(920px, calc(100% - 32px)); max-height: min(86vh, 900px);
  padding: 0; border: 1px solid var(--hair); border-radius: 18px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog.data::backdrop { background: rgba(13, 19, 27, 0.55); }
.dlg-head {
  position: sticky; top: 0; z-index: 1; background: var(--surface);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--hair);
}
.dlg-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.dlg-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.dlg-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.check-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.dlg-body { padding: 4px 22px 22px; overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.data-table th, .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--hair); text-align: right; white-space: nowrap; }
.data-table th:nth-child(-n+2), .data-table td:nth-child(-n+2) { text-align: left; }
.data-table thead th { position: sticky; top: 0; background: var(--surface); font-weight: 500; color: var(--muted); font-size: 12.5px; }
.data-table tr.is-focus td:first-child { box-shadow: inset 3px 0 0 var(--hl); }
.qswatch { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; vertical-align: 0; }

/* ==========================================================================
   Narrow screens: stage on top, text below, controls pinned to the bottom.
   ========================================================================== */
@media (max-width: 880px) {
  .app { height: auto; }
  .topbar { padding: 12px 16px 8px; }
  .brand-sub, #present, .kbd-hint, .wide-only { display: none; }
  .brand { font-size: 14px; white-space: nowrap; gap: 10px; }
  .brand-mark { width: 28px; height: 18px; }
  .top-actions .btn-ghost { white-space: nowrap; padding: 8px 10px; }
  .stage-head { flex-wrap: wrap; row-gap: 4px; }
  .stage-title { font-size: 14px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 0 16px; }
  .stage-wrap { order: -1; height: min(66vh, 600px); min-height: 380px; border-radius: 16px; }
  .stage-head { padding: 14px 16px 0; }
  .narrative { overflow: visible; padding: 16px 0 0; }
  .step-title { margin: 6px 0 12px; }
  .step-body p { max-width: none; font-size: 16px; }
  .controls {
    position: sticky; bottom: 0; z-index: 4;
    margin: 12px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--paper); border-top: 1px solid var(--hair);
  }
  .controls .btn { flex: 1; }
  .progress { padding: 14px 16px 24px; }
  .progress-groups { display: none; }
  .overlay { padding: 20px 16px; }
  .result-figure { font-size: 48px; }
  .result { text-align: left; }
  .rec-list { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; }
}
@media (max-width: 520px) {
  .rec-list li { grid-template-columns: 88px auto; }
  .rec-detail { display: none; }
  .legend { gap: 10px; font-size: 12px; }
  .cell { width: 16px; height: 16px; border-radius: 4px; }
  .cells { gap: 3px; }
}

@media (prefers-reduced-motion: reduce) {
  :root { --move: 0ms; }
  .dot, .dot *, .layer, .overlay, svg.stage, .rec-list li, .seg::before { transition: none !important; }
  .target-line, .target-label, .met-count { animation: none; }
}
@media (forced-colors: active) {
  .dot .body { stroke: CanvasText; }
  .dot.is-hollow .body { fill: Canvas; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 22" aria-hidden="true">
        <circle cx="4" cy="17" r="3.4" fill="var(--q1)"/>
        <circle cx="10.5" cy="14" r="3.4" fill="var(--q2)"/>
        <circle cx="17" cy="11" r="3.4" fill="var(--q3)"/>
        <circle cx="23.5" cy="8" r="3.4" fill="var(--q4)"/>
        <circle cx="30" cy="5" r="3.4" fill="var(--q5)"/>
      </svg>
      <span>PE growth, explained <span class="brand-sub">TIA quintile model</span></span>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost" id="open-data" type="button"><span>View <span class="wide-only">the </span>numbers</span></button>
      <button class="btn btn-ghost" id="present" type="button">Present</button>
    </div>
  </header>

  <main class="layout">
    <section class="narrative" aria-labelledby="step-title">
      <p class="step-count" id="step-count"></p>
      <h1 class="step-title" id="step-title" tabindex="-1"></h1>
      <div class="step-body" id="step-body"></div>
      <div class="controls">
        <button class="btn" id="prev" type="button">Back</button>
        <button class="btn btn-primary" id="next" type="button">Next</button>
        <span class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> to move</span>
      </div>
    </section>

    <section class="stage-wrap" id="stage-wrap" aria-label="Animated example">
      <div class="stage-head">
        <p class="stage-title" id="stage-title"></p>
        <div class="legend" id="legend"></div>
      </div>
      <svg class="stage" id="stage" role="img" aria-labelledby="stage-desc">
        <desc id="stage-desc"></desc>
        <g class="layer" id="layer-bands"></g>
        <g class="layer" id="layer-axis"></g>
        <g class="layer" id="layer-rows"></g>
        <g id="layer-dots"></g>
        <g class="layer" id="layer-anno"></g>
      </svg>

r C","score":{"boy":51,"eoy":66}},{"id":26,"name":"Student 26","teacher":"Teacher C","score":{"boy":70,"eoy":85}},{"id":27,"name":"Student 27","teacher":"Teacher C","score":{"boy":75,"eoy":94}},{"id":28,"name":"Student 28","teacher":"Teacher C","score":{"boy":48,"eoy":74}},{"id":29,"name":"Student 29","teacher":"Teacher C","score":{"boy":40,"eoy":68}},{"id":30,"name":"Student 30","teacher":"Teacher C","score":{"boy":77,"eoy":88}},{"id":31,"name":"Student 31","teacher":"Teacher C","score":{"boy":76,"eoy":94}},{"id":32,"name":"Student 32","teacher":"Teacher C","score":{"boy":39,"eoy":67}},{"id":33,"name":"Student 33","teacher":"Teacher C","score":{"boy":28,"eoy":49}},{"id":34,"name":"Student 34","teacher":"Teacher D","score":{"boy":26,"eoy":45}},{"id":35,"name":"Student 35","teacher":"Teacher D","score":{"boy":23,"eoy":52}},{"id":36,"name":"Student 36","teacher":"Teacher D","score":{"boy":18,"eoy":41}},{"id":37,"name":"Student 37","teacher":"Teacher D","score":{"boy":63,"eoy":74}},{"id":38,"name":"Student 38","teacher":"Teacher D","score":{"boy":49,"eoy":67}},{"id":39,"name":"Student 39","teacher":"Teacher D","score":{"boy":78,"eoy":86}},{"id":40,"name":"Student 40","teacher":"Teacher D","score":{"boy":72,"eoy":88}},{"id":41,"name":"Student 41","teacher":"Teacher D","score":{"boy":47,"eoy":72}},{"id":42,"name":"Student 42","teacher":"Teacher D","score":{"boy":54,"eoy":73}},{"id":43,"name":"Student 43","teacher":"Teacher E","score":{"boy":19,"eoy":49}},{"id":44,"name":"Student 44","teacher":"Teacher E","score":{"boy":37,"eoy":53}},{"id":45,"name":"Student 45","teacher":"Teacher E","score":{"boy":57,"eoy":67}},{"id":46,"name":"Student 46","teacher":"Teacher E","score":{"boy":42,"eoy":60}},{"id":47,"name":"Student 47","teacher":"Teacher E","score":{"boy":24,"eoy":55}},{"id":48,"name":"Student 48","teacher":"Teacher E","score":{"boy":55,"eoy":76}},{"id":49,"name":"Student 49","teacher":"Teacher E","score":{"boy":66,"eoy":87}},{"id":50,"name":"Student 50","teacher":"Teache <script>
(() => {
  "use strict";

  /* ======================================================================
     1. Data
     Made-up students. Each has one BOY score and one EOY score (0 to 100).
     ====================================================================== */
  const STUDENTS = JSON.parse(document.getElementById("students-data").textContent);
  const SUBJECTS = ["score"]; // one score per student, so each student is one record
  const FOCUS_TEACHER = "Teacher A";
  const QUINTILES = 5;

  /* ======================================================================
     2. Model: the quintile growth calculation
     Everything shown on the page is computed here from raw BOY and EOY
     scores, so the walkthrough and the data table can never disagree.
     ====================================================================== */
  function computeSubject(students, key) {
    const n = students.length;
    const sorted = [...students].sort((a, b) => a[key].boy - b[key].boy || a.id - b.id);
    const byId = new Map();
    sorted.forEach((s, rank) => {
      // Students with the same BOY score share the quintile of the first of them.
      const firstRank = sorted.findIndex((t) => t[key].boy === s[key].boy);
      const q = Math.floor((firstRank * QUINTILES) / n) + 1;
      byId.set(s.id, { id: s.id, rank, q, boy: s[key].boy, eoy: s[key].eoy, growth: s[key].eoy - s[key].boy });
    });
    const records = [...byId.values()];
    const quintiles = [];
    for (let q = 1; q <= QUINTILES; q++) {
      const members = records.filter((r) => r.q === q);
      const avg = members.reduce((t, r) => t + r.growth, 0) / members.length;
      quintiles.push({
        q, members, avg,
        minBoy: Math.min(...members.map((m) => m.boy)),
        maxBoy: Math.max(...members.map((m) => m.boy)),
        met: 0,
      });
    }
    for (const r of records) {
      const Q = quintiles[r.q - 1];
      r.target = Q.avg;
      r.met = r.growth >= Q.avg;
      if (r.met) Q.met += 1;
    }
    return { key, byId, quintiles, ordered: sorted.map((s) => byId.get(s.id)) };
  }

  function computeTeacher(students, model, teacher) {
    const kids = students.filter((s) => s.teacher === teacher).sort((a, b) => a.id - b.id);
    const records = [];
    for (const key of SUBJECTS) {
      for (const s of kids) records.push({ student: s, key, ...model[key].byId.get(s.id) });
    }
    const met = records.filter((r) => r.met).length;
    return { teacher, kids, records, met, total: records.length, share: met / records.length };
  }

  const MODEL = Object.fromEntries(SUBJECTS.map((k) => [k, computeSubject(STUDENTS, k)]));
  const TEACHER = computeTeacher(STUDENTS, MODEL, FOCUS_TEACHER);
  const byName = (name) => STUDENTS.find((s) => s.name === name);
  const rec = (student, key) => MODEL[key].byId.get(student.id);
  const fmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
  const pct = (v) => `${Math.round(v * 100)}%`;

  // Two students the walkthrough follows.
  // Student A starts in Quintile 2 and grows more than Student B but misses the group's target.
  // Student B starts in Quintile 5, grows less, and meets the group's target.
  const STUDENT_A = byName("Student 4");
  const STUDENT_B = byName("Student 16");
  const A = STUDENT_A.name;
  const B = STUDENT_B.name;
  const aRec = rec(STUDENT_A, "score");
  const bRec = rec(STUDENT_B, "score");
  const FEATURED = new Set([A, B]);
  const QS = MODEL.score.quintiles;
  const N = STUDENTS.length;
  const GROUP_SIZE = N / QUINTILES;

  /* ======================================================================
     3. Helpers
     ====================================================================== */
  const SVG_NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const linear = (d0, d1, r0, r1) => (v) => r0 + ((v - d0) / (d1 - d0)) * (r1 - r0);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function svgEl(tag, attrs, parent) {
    const node = document.createElementNS(SVG_NS, tag);
    if (attrs) for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }
  function svgText(parent, x, y, cls, text, extra) {
    const t = svgEl("text", { x, y, class: cls, ...(extra || {}) }, parent);
    t.textContent = text;
    return t;
  }
  // Small seeded random generator so the "scattered" layout is the same on every visit.
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20261028);
  const SCATTER_ORDER = STUDENTS.map((s) => ({ id: s.id, k: rand() })).sort((a, b) => a.k - b.k).map((o) => o.id);
  const JITTER = new Map(STUDENTS.map((s) => [s.id, [rand() * 2 - 1, rand() * 2 - 1]]));

  function niceTicks(d0, d1, maxTicks) {
    const steps = [5, 10, 20, 25, 50, 100];
    const step = steps.find((s) => (d1 - d0) / s <= maxTicks) || 100;
    const ticks = [];
    for (let v = Math.ceil(d0 / step) * step; v <= d1; v += step) ticks.push(v);
    return ticks;
  }

  // Beeswarm: place each dot as close to its baseline as possible without overlapping.
  function swarm(points, cy, r, gap) {
    const minD = 2 * r + gap;
    const placed = [];
    const out = new Map();
    let maxOff = 0;
    for (const p of [...points].sort((a, b) => a.x - b.x || a.id - b.id)) {
      let off = 0;
      for (let k = 0; k < 2000; k++) {
        const cand = (k % 2 === 0 ? 1 : -1) * Math.ceil(k / 2);
        const y = cy + cand;
        const hit = placed.some((q) => Math.abs(q.x - p.x) < minD && Math.hypot(q.x - p.x, q.y - y) < minD);
        if (!hit) { off = cand; break; }
      }
      const pt = { x: p.x, y: cy + off };
      placed.push(pt);
      out.set(p.id, pt);
      maxOff = Math.max(maxOff, Math.abs(off));
    }
    return { pos: out, maxOff };
  }

  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  const coarsePointer = window.matchMedia("(pointer: coarse)");
  const ICON_CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_X = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  /* ======================================================================
     4. Stage: geometry for each layout
     ====================================================================== */
  const BASE_R = 20;
  const svg = $("stage");
  const stageWrap = $("stage-wrap");
  const layers = { bands: $("layer-bands"), axis: $("layer-axis"), rows: $("layer-rows"), dots: $("layer-dots"), anno: $("layer-anno") };
  let W = 0, H = 0;

  function measure() {
    W = Math.max(280, stageWrap.clientWidth);
    H = Math.max(300, stageWrap.clientHeight);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  }
  const narrow = () => W < 620;
  const stageHead = document.querySelector(".stage-head");
  let headH = 0; // measured height of the stage heading, so a wrapped title never overlaps the chart
  const pad = () => (narrow()
    ? { l: 14, r: 14, t: Math.max(56, headH + 10), b: 36 }
    : { l: 28, r: 28, t: Math.max(74, headH + 12), b: 40 });

  function layoutScatter() {
    const p = pad();
    const iw = W - p.l - p.r, ih = H - p.t - p.b;
    const cols = clamp(Math.round(Math.sqrt((N * iw) / ih)), 4, 12);
    const rows = Math.ceil(N / cols);
    const cw = iw / cols, ch = ih / rows;
    const r = clamp(Math.min(cw, ch) * 0.36, 8, 22);
    const pos = new Map();
    SCATTER_ORDER.forEach((id, i) => {
      const row = Math.floor(i / cols);
      const inRow = row === rows - 1 ? N - row * cols : cols;
      const shift = ((cols - inRow) * cw) / 2;
      const j = JITTER.get(id);
      pos.set(id, { x: p.l + shift + (i % cols + 0.5 + j[0] * 0.2) * cw, y: p.t + (row + 0.5 + j[1] * 0.2) * ch });
    });
    return { kind: "scatter", pos, r };
  }

  // Students sorted by BOY score, read like a line that wraps: left to right, top to bottom.
  // Rows of 10 on wide screens (one quintile per row), rows of 5 on phones (two rows per quintile).
  function layoutSorted(key, split) {
    const p = pad();
    const tight = narrow();
    const m = MODEL[key];
    const cols = tight ? 5 : 10;
    const perQ = GROUP_SIZE / cols;
    const totalRows = N / cols;
    const labelW = split ? (tight ? 34 : 136) : 0;
    const gap = split ? (tight ? 12 : 18) : 0;
    const top = p.t + 4;
    const bottom = H - 22;
    const availW = W - p.l - p.r - labelW;
    const availH = bottom - top - gap * (QUINTILES - 1);
    const cw = Math.min(availW / cols, 66);
    const ch = Math.min(availH / totalRows, 66);
    const r = clamp(Math.min(cw, ch) * 0.37, 7, 22);
    const gridW = cw * cols;
    const gridH = ch * totalRows + gap * (QUINTILES - 1);
    const x0 = p.l + labelW + (availW - gridW) / 2;
    const y0 = top + (bottom - top - gridH) / 2;
    const pos = new Map();
    for (const d of m.ordered) {
      const row = Math.floor(d.rank / cols);
      const q = Math.floor(row / perQ);
      pos.set(d.id, { x: x0 + ((d.rank % cols) + 0.5) * cw, y: y0 + row * ch + q * gap + ch / 2 });
    }
    const blocks = m.quintiles.map((Q, i) => ({ Q, y: y0 + i * (perQ * ch + gap), h: perQ * ch }));
    return { kind: "sorted", key, split, pos, r, blocks, x0, gridW, cw };
  }

  function layoutRows(key) {
    const p = pad();
    const m = MODEL[key];
    const labelW = narrow() ? 34 : 136;
    const left = p.l + labelW;
    const right = W - p.r;
    // One growth axis shared by every subject on the page.
    const all = SUBJECTS.flatMap((k) => MODEL[k].ordered).map((r) => r.growth);
    const d0 = Math.floor((Math.min(...all) - 4) / 10) * 10;
    const d1 = Math.ceil((Math.max(...all) + 4) / 10) * 10;
    const x = linear(d0, d1, left + 12, right - 10);
    const axisY = H - p.b;
    const top = p.t;
    const rh = (axisY - 8 - top) / QUINTILES;
    const rowTop = (q) => top + (q - 1) * rh;
    const rowCy = (q) => rowTop(q) + rh / 2 + 7;
    let r = clamp(Math.min(rh * 0.15, narrow() ? W / 55 : W / 92), 5, 11);
    let pos, ok = false;
    for (let i = 0; i < 8 && !ok; i++) {
      pos = new Map();
      ok = true;
      for (const Q of m.quintiles) {
        const sw = swarm(Q.members.map((d) => ({ id: d.id, x: x(d.growth) })), rowCy(Q.q), r, 2);
        sw.pos.forEach((v, k) => pos.set(k, v));
        if (sw.maxOff + r > rh / 2 - 9) ok = false;
      }
      if (!ok) r *= 0.88;
    }
    return { kind: "rows", key, pos, r, x, d0, d1, axisY, rh, rowTop, rowCy, left, right };
  }

  /* ======================================================================
     5. Stage: rendering
     ====================================================================== */
  const DOTS = new Map();
  (function createDots() {
    // Students with callouts are drawn last so they sit on top of their neighbors.
    const order = [...STUDENTS].sort((a, b) => FEATURED.has(a.name) - FEATURED.has(b.name));
    for (const s of order) {
      const g = svgEl("g", { class: "dot", "data-id": s.id }, layers.dots);
      svgEl("circle", { class: "hit", r: BASE_R + 10 }, g);
      const ring = svgEl("circle", { class: "ring", r: BASE_R + 6 }, g);
      svgEl("circle", { class: "body", r: BASE_R }, g);
      const num = svgEl("text", { class: "num", y: 0.5 }, g);
      svgEl("path", { class: "glyph check", d: "M-8 0.5 L-2.5 6 L8.5 -6.5" }, g);
      svgEl("path", { class: "glyph xmark", d: "M-6 -6 L6 6 M6 -6 L-6 6" }, g);
      g.style.transform = `translate(${0}px, ${0}px) scale(0)`;
      DOTS.set(s.id, { g, ring, num, s });
    }
  })();

  let layout = null;
  let spec = null;
  let renderToken = 0;
  const timers = new Set();
  const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
  const clearLater = () => { timers.forEach(clearTimeout); timers.clear(); };

  const DEFAULT_SPEC = {
    layout: "scatter", subject: "score", color: false, numbers: false, avg: false, met: false,
    counts: false, highlight: [], callouts: [], dimOthers: false, overlay: null, reveal: 0,
    stagger: null, title: "", sub: "", legend: null, desc: "",
  };

  function applySpec(next, opts = {}) {
    const instant = !!opts.instant || prefersReduced.matches;
    const prev = spec;
    spec = { ...DEFAULT_SPEC, ...next };
    const token = ++renderToken;
    hideTooltip();

    // Stage heading and legend first: the layout reserves room for their measured height.
    $("stage-title").innerHTML = esc(spec.title) + (spec.sub ? `<span class="stage-sub">${esc(spec.sub)}</span>` : "");
    $("legend").innerHTML = spec.legend === "met"
      ? `<span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="var(--q4)"/></svg>Met target</span><span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.25" fill="none" stroke="var(--q4)" stroke-width="1.5"/></svg>Not met</span>`
      : spec.legend === "hint" ? `<span class="stage-hint">${coarsePointer.matches ? "Tap" : "Point at"} a dot for details</span>` : "";
    $("stage-desc").textContent = spec.desc;
    headH = spec.title || spec.legend ? stageHead.offsetHeight : 0;

    layout = spec.layout === "scatter" ? layoutScatter()
      : spec.layout === "rows" ? layoutRows(spec.subject)
      : layoutSorted(spec.subject, spec.layout === "split");

    svg.classList.toggle("no-anim", instant);
    const model = MODEL[spec.subject];
    const s = layout.r / BASE_R;
    const hl = new Set(spec.highlight);

    for (const { g, ring, num, s: stu } of DOTS.values()) {
      const r = model.byId.get(stu.id);
      const pt = layout.pos.get(stu.id);
      let delay = 0;
      if (!instant) {
        if (spec.stagger === "rank") delay = r.rank * 16;
        else if (spec.stagger === "quintile") delay = (r.q - 1) * 70 + (r.rank % GROUP_SIZE) * 10;
        else if (spec.stagger === "intro") delay = 150 + SCATTER_ORDER.indexOf(stu.id) * 14;
      }
      g.style.transitionDelay = `${delay}ms, 0ms`;
      g.style.transform = `translate(${pt.x.toFixed(2)}px, ${pt.y.toFixed(2)}px) scale(${s.toFixed(4)})`;
      ring.setAttribute("r", (BASE_R + 4.5 / s).toFixed(2));
      num.textContent = r.boy;
      g.style.setProperty("--qc", `var(--q${r.q})`);
      g.style.setProperty("--qon", `var(--q${r.q}-on)`);
      g.classList.toggle("is-colored", spec.color && !(spec.met && !r.met));
      g.classList.toggle("is-met", spec.met && r.met);
      g.classList.toggle("is-hollow", spec.met && !r.met);
      g.classList.toggle("is-hl", hl.has(stu.name));
      g.classList.toggle("is-dim", spec.dimOthers && stu.teacher !== FOCUS_TEACHER);
    }
    svg.classList.toggle("show-nums", spec.numbers && layout.r >= 13);

    // Supporting layers fade out, are redrawn, then fade back in once the dots have moved.
    const sameFrame = prev && prev.layout === spec.layout && prev.subject === spec.subject && !opts.instant;
    const redraw = () => {
      if (token !== renderToken) return;
      drawBands();
      drawAxis();
      drawRows();
      for (const k of ["bands", "axis", "rows"]) layers[k].classList.remove("is-out");
    };
    if (instant) redraw();
    else if (sameFrame) redraw();
    else {
      for (const k of ["bands", "axis", "rows"]) layers[k].classList.add("is-out");
      later(redraw, spec.stagger === "rank" ? 900 : 520);
    }

    layers.anno.replaceChildren();
    layers.anno.classList.add("is-out");
    if (spec.callouts.length) {
      const wait = instant ? 0 : sameFrame ? 250 : spec.stagger === "quintile" ? 1250 : 1000;
      later(() => { if (token === renderToken) { drawCallouts(); layers.anno.classList.remove("is-out"); } }, wait);
    }

    setOverlay(spec.overlay);

    if (instant) {
      // Force a style flush so the next change animates again.
      void svg.getBoundingClientRect();
      requestAnimationFrame(() => svg.classList.remove("no-anim"));
    }
  }

  function drawBands() {
    const g = layers.bands;
    g.replaceChildren();
    if (spec.layout !== "split") return;
    const L = layout;
    const p = pad();
    const tight = narrow();
    const padX = Math.min(10, L.cw * 0.12);
    for (const { Q, y, h } of L.blocks) {
      svgEl("rect", { x: L.x0 - padX, y: y + 2, width: L.gridW + padX * 2, height: h - 4, rx: 14, class: "band", fill: `var(--q${Q.q})` }, g);
      svgEl("rect", { x: p.l, y: y + 6, width: 4, height: h - 12, rx: 2, fill: `var(--q${Q.q})` }, g);
      const mid = y + h / 2;
      if (tight) {
        svgText(g, p.l + 11, mid + 5, "row-label", `Q${Q.q}`);
      } else {
        svgText(g, p.l + 14, mid - 2, "row-label", `Quintile ${Q.q}`);
        svgText(g, p.l + 14, mid + 15, "row-range", `BOY ${Q.minBoy} to ${Q.maxBoy}`);
      }
    }
  }

  function drawAxis() {
    const g = layers.axis;
    g.replaceChildren();
    if (spec.layout !== "rows") return;
    const L = layout;
    const ticks = niceTicks(L.d0, L.d1, Math.max(3, Math.floor(W / 95)));
    const gridTop = L.rowTop(1) + 4;
    for (const t of ticks) {
      const x = L.x(t);
      svgEl("line", { x1: x, x2: x, y1: gridTop, y2: L.axisY, class: "grid-line" }, g);
      svgEl("line", { x1: x, x2: x, y1: L.axisY, y2: L.axisY + 5, class: "axis-line" }, g);
      svgText(g, x, L.axisY + 20, "tick", t);
    }
    svgEl("line", { x1: L.left, x2: W - pad().r, y1: L.axisY, y2: L.axisY, class: "axis-line" }, g);
  }

  function drawRows() {
    const g = layers.rows;
    g.replaceChildren();
    if (spec.layout !== "rows") return;
    const L = layout;
    const p = pad();
    const tight = narrow();
    for (const Q of MODEL[spec.subject].quintiles) {
      const y0 = L.rowTop(Q.q);
      if (Q.q > 1) svgEl("line", { x1: p.l, x2: W - p.r, y1: y0, y2: y0, class: "row-sep" }, g);
      svgEl("rect", { x: p.l, y: y0 + 10, width: 4, height: L.rh - 20, rx: 2, fill: `var(--q${Q.q})` }, g);
      const mid = y0 + L.rh / 2;
      if (tight) {
        svgText(g, p.l + 11, mid + 5, "row-label", `Q${Q.q}`);
      } else {
        svgText(g, p.l + 14, mid - 2, "row-label", `Quintile ${Q.q}`);
        svgText(g, p.l + 14, mid + 15, "row-range", `BOY ${Q.minBoy} to ${Q.maxBoy}`);
      }
      if (spec.avg) {
        const x = L.x(Q.avg);
        svgEl("line", { x1: x, x2: x, y1: y0 + 8, y2: y0 + L.rh - 6, class: "target-line" }, g);
        svgText(g, x + 7, y0 + 19, "target-label", tight ? fmt(Q.avg) : `Target ${fmt(Q.avg)}`);
      }
      if (spec.counts) svgText(g, W - p.r, y0 + 19, "met-count", tight ? `${Q.met}/${Q.members.length}` : `${Q.met} of ${Q.members.length} met`);
    }
  }

  // Callouts try several positions around their dot and keep the one that covers
  // the fewest labels, other callouts and dots.
  function drawCallouts() {
    const g = layers.anno;
    g.replaceChildren();
    const L = layout;
    const overlaps = (a, b, m = 4) => a.x < b.x + b.w + m && a.x + a.w + m > b.x && a.y < b.y + b.h + m && a.y + a.h + m > b.y;
    const labels = [...layers.rows.querySelectorAll("text"), ...layers.bands.querySelectorAll("text")].map((t) => {
      const b = t.getBBox();
      return { x: b.x, y: b.y, w: b.width, h: b.height };
    });
    const placed = [];
    const minTop = pad().t - 8;
    for (const c of spec.callouts) {
      const stu = byName(c.name);
      const pt = L.pos.get(stu.id);
      const box = svgEl("g", { class: "callout" }, g);
      const lead = svgEl("line", { class: "callout-lead" }, box);
      const rect = svgEl("rect", { class: "callout-box", rx: 10 }, box);
      const t1 = svgText(box, 0, 0, "callout-title", c.title);
      const t2 = svgText(box, 0, 0, "callout-detail", c.detail);
      const bw = Math.ceil(Math.max(t1.getComputedTextLength(), t2.getComputedTextLength())) + 24;
      const bh = 48;
      const gy = L.r + 12, gx = L.r + 14;
      const candidates = [
        [pt.x - bw / 2, pt.y - gy - bh], [pt.x - bw + 28, pt.y - gy - bh], [pt.x - 28, pt.y - gy - bh],
        [pt.x - gx - bw, pt.y - bh / 2], [pt.x + gx, pt.y - bh / 2],
        [pt.x - bw / 2, pt.y + gy], [pt.x - bw + 28, pt.y + gy], [pt.x - 28, pt.y + gy],
      ];
      let best = null;
      candidates.forEach(([cx, cy], idx) => {
        const cand = { x: clamp(cx, 8, W - bw - 8), y: cy, w: bw, h: bh };
        if (cand.y < minTop || cand.y + bh > H - 6) return;
        let score = idx;
        if (overlaps(cand, { x: pt.x - L.r, y: pt.y - L.r, w: 2 * L.r, h: 2 * L.r }, 3)) score += 5000;
        for (const o of [...labels, ...placed]) if (overlaps(cand, o)) score += 1000;
        for (const [id, q] of L.pos) {
          if (id !== stu.id && overlaps(cand, { x: q.x - L.r, y: q.y - L.r, w: 2 * L.r, h: 2 * L.r }, 1)) score += 12;
        }
        if (!best || score < best.score) best = { ...cand, score };
      });
      if (!best) best = { x: clamp(pt.x - bw / 2, 8, W - bw - 8), y: clamp(pt.y + gy, minTop, H - bh - 6), w: bw, h: bh };
      placed.push(best);
      rect.setAttribute("x", best.x); rect.setAttribute("y", best.y);
      rect.setAttribute("width", bw); rect.setAttribute("height", bh);
      t1.setAttribute("x", best.x + 12); t1.setAttribute("y", best.y + 20);
      t2.setAttribute("x", best.x + 12); t2.setAttribute("y", best.y + 37);
      // Leader line: from the edge of the dot to the nearest point on the box.
      const nx = clamp(pt.x, best.x, best.x + bw), ny = clamp(pt.y, best.y, best.y + bh);
      const len = Math.hypot(nx - pt.x, ny - pt.y) || 1;
      const sx = pt.x + ((nx - pt.x) / len) * (L.r + 4), sy = pt.y + ((ny - pt.y) / len) * (L.r + 4);
      lead.setAttribute("x1", sx); lead.setAttribute("y1", sy);
      lead.setAttribute("x2", nx); lead.setAttribute("y2", ny);
    }
  }

  const tooltip = $("tooltip");
  function showTooltip(id, clientX, clientY) {
    if (!spec || spec.overlay) return;
    const stu = STUDENTS.find((s) => s.id === id);
    const r = MODEL[spec.subject].byId.get(id);
    const lv = spec.reveal;
    const rows = [];
    if (lv >= 1) rows.push(["BOY", r.boy]);
    if (lv >= 2) rows.push(["Quintile", r.q]);
    if (lv >= 3) rows.push(["EOY", r.eoy], ["Growth", r.growth]);
    if (lv >= 4) rows.push(["Target", fmt(r.target)]);
    if (lv >= 5) rows.push(["Result", r.met ? "Met" : "Not met"]);
    tooltip.innerHTML = `<strong>${esc(stu.name)}</strong><div class="tip-teacher">${esc(stu.teacher)}'s class</div>`
      + (rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "");
    tooltip.hidden = false;
    const box = stageWrap.getBoundingClientRect();
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let x = clientX - box.left + 14;
    let y = clientY - box.top + 14;
    if (x + tw > box.width - 8) x = clientX - box.left - tw - 14;
    if (y + th > box.height - 8) y = clientY - box.top - th - 14;
    tooltip.style.left = `${clamp(x, 8, box.width - tw - 8)}px`;
    tooltip.style.top = `${clamp(y, 8, box.height - th - 8)}px`;
  }
  function hideTooltip() { tooltip.hidden = true; }
  svg.addEventListener("pointermove", (e) => {

  /* ======================================================================
     9. Navigation, progress, keyboard, URL
     ====================================================================== */
  let current = -1;
  const progressEl = $("progress");
  const groupsEl = $("progress-groups");
  document.documentElement.style.setProperty("--steps", STEPS.length);

  STEPS.forEach((st, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<button class="seg" type="button" aria-label="Step ${i + 1}: ${esc(st.short)}"></button>`;
    li.firstChild.addEventListener("click", () => goTo(i));
    progressEl.appendChild(li);
  });
  (function buildGroups() {
    let start = 0;
    for (let i = 1; i <= STEPS.length; i++) {
      if (i === STEPS.length || STEPS[i].group !== STEPS[start].group) {
        const d = document.createElement("div");
        d.className = "pg";
        d.dataset.group = STEPS[start].group;
        d.style.gridColumn = `${start + 1} / span ${i - start}`;
        d.textContent = STEPS[start].group;
        groupsEl.appendChild(d);
        start = i;
      }
    }
  })();

  function goTo(i, opts = {}) {
    i = clamp(i, 0, STEPS.length - 1);
    if (i === current) return;
    clearLater();
    const st = STEPS[i];
    current = i;

    $("step-count").textContent = st.group === "Start" || st.group === "Summary"
      ? `Step ${i + 1} of ${STEPS.length}`
      : `${st.group}, step ${i + 1} of ${STEPS.length}`;
    $("step-title").textContent = st.title;
    $("step-body").innerHTML = st.body();
    $("prev").disabled = i === 0;
    $("next").textContent = i === 0 ? "Start" : i === STEPS.length - 1 ? "Start over" : "Next";
    $("announcer").textContent = `Step ${i + 1} of ${STEPS.length}: ${st.title}`;

    progressEl.querySelectorAll(".seg").forEach((b, k) => {
      b.classList.toggle("is-current", k === i);
      b.classList.toggle("is-done", k < i);
      if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    groupsEl.querySelectorAll(".pg").forEach((g) => g.classList.toggle("is-current", g.dataset.group === st.group));

    applySpec(st.spec, { instant: !!opts.instant });

    const hash = `#step-${i + 1}`;
    if (location.hash !== hash) history.replaceState(null, "", hash);
  }

  const next = () => goTo(current === STEPS.length - 1 ? 0 : current + 1);
  const prev = () => goTo(current - 1);
  $("next").addEventListener("click", next);
  $("prev").addEventListener("click", prev);

  document.addEventListener("keydown", (e) => {
    if (dialog.open || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target.closest("input, select, textarea")) return;
    if (["ArrowRight", "PageDown"].includes(e.key)) { e.preventDefault(); if (current < STEPS.length - 1) next(); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === "Home") { e.preventDefault(); goTo(0); }
    else if (e.key === "End") { e.preventDefault(); goTo(STEPS.length - 1); }
  });

  window.addEventListener("hashchange", () => {
    const m = /^#step-(\d+)$/.exec(location.hash);
    if (m) goTo(Number(m[1]) - 1);
  });

  /* Present (full screen) */
  const presentBtn = $("present");

    $("dlg-body").innerHTML = `<table class="data-table">
      <caption class="sr-only">Results for every student, sorted by BOY score</caption>
      <thead><tr><th scope="col">Student</th><th scope="col">Teacher</th><th scope="col">BOY</th><th scope="col">EOY</th><th scope="col">Growth</th><th scope="col">Quintile</th><th scope="col">Target</th><th scope="col">Result</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
  function openData() {
    renderTable();
    if (!dialog.open) dialog.showModal();
  }
  $("open-data").addEventListener("click", openData);
  $("close-data").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
  $("only-focus").addEventListener("change", renderTable);

  /* ======================================================================
     11. Start
     ====================================================================== */
  let resizeFrame = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      const w = W, h = H;
      measure();
      if (spec && (Math.abs(W - w) > 1 || Math.abs(H - h) > 1)) applySpec(spec, { instant: true });
    });
  }).observe(stageWrap);

  // Exposed for automated checks; not used by the page itself.
  window.QuintileDemo = { MODEL, TEACHER, STEPS, goTo };

  const startAt = (() => {
    const m = /^#step-(\d+)$/.exec(location.hash);
    return m ? Number(m[1]) - 1 : 0;
  })();
  const boot = () => {
    measure();
    if (startAt === 0 && !prefersReduced.matches) {
      // Dots begin collapsed at the center, then spread out: the page's one entrance moment.
      for (const { g } of DOTS.values()) g.style.transform = `translate(${W / 2}px, ${H / 2}px) scale(0)`;
      void svg.getBoundingClientRect();
      requestAnimationFrame(() => goTo(0));
    } else {
      goTo(startAt, { instant: true });
    }
  };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot);
})();
</script>
</body>
